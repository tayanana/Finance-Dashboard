<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Visualizer</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Finance Analytics Dashboard</span>
            <div class="navbar-nav flex-row">
                <a class="nav-link me-3" href="index.html">Transactions</a>
                <a class="nav-link active" href="visualizer.html">Visualizer</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white pt-3 pb-2">
                        <h5 class="card-title mb-0">Expenses by Category</h5>
                    </div>
                    <div class="card-body d-flex justify-content-center">
                        <canvas id="categoryPieChart" style="max-height: 300px;"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white pt-3 pb-2">
                        <h5 class="card-title mb-0">Monthly Income vs Expenses</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="monthlyBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Fetch and render Pie Chart (Expenses by Category)
            fetch('http://localhost:3000/api/expenses-by-category')
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('categoryPieChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: data.map(row => row.category),
                            datasets: [{
                                data: data.map(row => row.total),
                                backgroundColor: [
                                    '#FF6384', '#36A2EB', '#FFCE56', 
                                    '#4BC0C0', '#9966FF', '#FF9F40'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'bottom' }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching pie chart data:', error));

            // 2. Fetch and render Bar Chart (Monthly Trends)
            fetch('http://localhost:3000/api/monthly-summary')
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('monthlyBarChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.map(row => row.month),
                            datasets: [
                                {
                                    label: 'Income',
                                    data: data.map(row => row.income),
                                    backgroundColor: '#4BC0C0'
                                },
                                {
                                    label: 'Expense',
                                    data: data.map(row => row.expense),
                                    backgroundColor: '#FF6384'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: { beginAtZero: true }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching bar chart data:', error));
        });
    </script>
</body>
</html>
