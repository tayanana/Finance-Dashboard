<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Analytics Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Finance Analytics Dashboard</span>
            <div class="navbar-nav flex-row">
                <a class="nav-link active me-3" href="index.html">Transactions</a>
                <a class="nav-link" href="visualizer.html">Visualizer</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h4 class="card-title">Transaction Log</h4>
                    </div>
                    <div class="card-body">
                        <table id="transactionsTable" class="table table-striped table-hover" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function() {
            // Initialize the DataTable
            $('#transactionsTable').DataTable({
                // Fetch the JSON from your Express server
                ajax: {
                    url: 'http://localhost:3000/api/transactions',
                    dataSrc: '' 
                },
                columns: [
                    { 
                        data: 'transaction_date',
                        render: function(data, type) {
                            if (type === 'display' || type === 'filter') {
                                return data.split('T')[0]; 
                            }
                            return data;
                        }
                    },
                    { 
                        data: 'description',
                        render: function(data, type) {
                            if (type === 'display') {
                                const div = document.createElement('div');
                                div.textContent = data;
                                return div.innerHTML;
                            }
                            return data;
                        }
                    },
                    { data: 'category' },
                    { 
                        data: 'type',
                        render: function(data, type) {
                            if (type === 'display') {
                                if (data === 'Income') {
                                    return '<span class="badge bg-success">Income</span>';
                                } else {
                                    return '<span class="badge bg-danger">Expense</span>';
                                }
                            }
                            return data;
                        }
                    },
                    { 
                        data: 'amount',
                        render: function(data, type) {
                            if (type === 'display') {
                                return '$' + parseFloat(data).toFixed(2);
                            }
                            return parseFloat(data);
                        }
                    }
                ],
                order: [[0, 'desc']],
                pageLength: 10
            });
        });
    </script>
</body>
</html>
